name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every Linux job here runs on Blacksmith, which needs the Blacksmith GitHub App installed
# on this repository. Stay on 2vcpu: a job asking for a label this account's plan does not
# serve, which is any larger size and every `blacksmith-*-arm` label, is accepted and then
# queues forever rather than failing.
#
# Blacksmith also intercepts the Actions cache API, and can answer
# `400 Default branch not found for repository` for a repository it has not picked up yet,
# which makes the `actions/setup-node` cache step warn. That is their end. Drop the cache
# line rather than debugging it.
jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Both platforms, because spawning, path handling and line endings are where this breaks
  # first and the failures are never subtle.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The name is spelled out above rather than left to GitHub to append, because the
          # required status check is `Test (ubuntu-latest)` and the runner has to be able to
          # change without the context name changing with it.
          - os: ubuntu-latest
            runner: blacksmith-2vcpu-ubuntu-2404
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  types:
    name: Type tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:types

  # The examples import the package by name and run against src/, with no TTY, so they are
  # the first thing to break when the public surface moves or something starts asking a
  # question it cannot ask in a pipeline.
  examples:
    name: Examples
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm examples

  # The published package, not the repository: publint reads the exports map and attw
  # proves the declarations resolve for consumers, neither of which the local tsc run can
  # tell us.
  package:
    name: Package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:exports
