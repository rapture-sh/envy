name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# The version job runs on Blacksmith, which needs the Blacksmith GitHub App installed on
# this repository. Stay on 2vcpu: a job asking for a label this account's plan does not
# serve, which is any larger size and every `blacksmith-*-arm` label, is accepted and then
# queues forever rather than failing. The publish job cannot use it, and says why.
#
# Blacksmith also intercepts the Actions cache API, and can answer
# `400 Default branch not found for repository` for a repository it has not picked up yet,
# which makes the `actions/setup-node` cache step warn. That is their end. Drop the cache
# line rather than debugging it.
#
# The two jobs below are one workflow rather than two files because a trusted publisher on
# npm is registered against a single workflow filename. Splitting the publish into its own
# file would mean re-registering it there.
jobs:
  # Opens and maintains the version pull request while changesets are pending, and does
  # nothing else. Merging it lands the bumped `package.json` and the changelog on main;
  # pushing `v<version>` is what publishes. `checks.yml` already runs the suite on every
  # push to main, so this job does not repeat it.
  version:
    name: Version
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    # Not Blacksmith. The registry rejects a provenance statement built anywhere but a
    # GitHub hosted runner, and Blacksmith is self-hosted as far as it is concerned, so a
    # publish from there fails with
    # `422 ... Unsupported GitHub Actions runner environment: "self-hosted"`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange trusted publishing needs, which is also what lets
      # the registry attest that this tarball was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm a Node release ships
      # with is older than that often enough to be worth pinning rather than hoping.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with `package.json` would publish a version nobody decided on,
      # and the registry would take it. Fail here instead, where it costs nothing.
      - name: Check the tag against package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # Ends with the build and then packs it for `attw`, so `dist` is current by the time
      # the publish below reads it.
      - run: pnpm check

      # npm, because `pnpm publish` does not do the OIDC exchange that trusted publishing
      # needs. No NODE_AUTH_TOKEN, for the same reason the exchange works at all: an empty
      # one writes an empty auth line into the .npmrc that setup-node generates, and npm
      # tries that first.
      - run: npm publish
