name: Bug report
description: Something is broken, types included
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is it
      options:
        - Types (something is not checked, or is checked wrongly)
        - defineConfig and the schema
        - load, asking, or the config file
        - The template file
        - write, or one of the formats
        - cmd (spawning, arguments, timeouts, Windows)
        - wait (polling, timeouts)
        - Docker adapter
        - Convex adapter
        - Output, prompts, colour
        - Warnings (including the gitignore check)
        - Published package (exports, resolution, publint, attw)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you called, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest script that triggers it, including the `defineConfig` call, since
        almost everything here depends on how the schema was declared. For a type bug,
        paste the full compiler error. Redact every value; the shape is what matters.
      render: js
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@rapture-sh/envy 0.1.0, or the commit you built from"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and shell
      description: Spawning and path handling break here first, so both matter.
      placeholder: "Windows 11, PowerShell. Or: macOS 15, zsh"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node and package manager
      placeholder: "Node 22.17, pnpm 10.23"
    validations:
      required: true

  - type: input
    id: typescript
    attributes:
      label: TypeScript version and moduleResolution
      description: Only needed for a type bug.
      placeholder: "5.9.3, bundler"

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you post
      options:
        - label: No credential, no real `config.yml`, and nothing out of one in this report
          required: true
